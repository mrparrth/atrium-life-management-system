<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with Canvas Color -->
  <rect width="512" height="512" rx="128" fill="#F9F8F6"/>
  <!-- Minimalist calm archway representing "Atrium" -->
  <path d="M180,380 V240 A76,76 0 0,1 332,240 V380" fill="none" stroke="#2D2B2A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A calm circle/sun in the center of the arch in Strategic green -->
  <circle cx="256" cy="230" r="32" fill="#5A7353"/>
  <!-- Base line of the archway -->
  <line x1="140" y1="380" x2="372" y2="380" stroke="#2D2B2A" stroke-width="20" stroke-linecap="round"/>
</svg>
